name: Generate Daily Poem

on:
  schedule:
    # Run daily at 00:00 UTC (midnight)
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate poem
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.API_URL }}/api/poems/generate" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "❌ Failed to generate poem"
            exit 1
          fi
          echo "✅ Poem generated successfully"
